// 音乐播放器类
class MusicPlayer {
    constructor() {
        this.audioPlayer = document.getElementById('mp3Player');
        this.playlistContainer = document.getElementById('playlist');
        this.currentSongDisplay = document.getElementById('curSong');
        this.progressBar = document.getElementById('progress');
        this.currentTimeDisplay = document.getElementById('currentTime');
        this.totalTimeDisplay = document.getElementById('totalTime');
        this.playBtn = document.getElementById('playBtn');
        this.prevBtn = document.getElementById('prevBtn');
        this.nextBtn = document.getElementById('nextBtn');
        this.songCountDisplay = document.getElementById('songCount');
        this.searchInput = document.getElementById('searchInput');
        
        // 播放器状态
        this.currentSongIndex = 0;
        this.songs = [];
        this.filteredSongs = [];
        this.isPlaying = false;
        this.timerInterval = null;
        
        // 初始化
        this.init();
    }
    
    // 初始化播放器
    init() {
        this.loadSongs();
        this.setupEventListeners();
        this.updateSongCount();
    }
    
    // 加载歌曲
    loadSongs() {
        this.songs = ALL_SONGS;
        this.filteredSongs = [...this.songs];
        this.renderPlaylist();
    }
    
    // 渲染播放列表
    renderPlaylist() {
        this.playlistContainer.innerHTML = '';
        
        this.filteredSongs.forEach((song, index) => {
            const songElement = document.createElement('div');
            songElement.className = 'song-item';
            
            // 找到当前歌曲在原始列表中的索引
            const originalIndex = this.songs.findIndex(s => s.id === song.id);
            if (originalIndex === this.currentSongIndex) {
                songElement.classList.add('active');
            }
            
            songElement.innerHTML = `
                <div class="song-number">${originalIndex + 1}</div>
                <div class="song-title">${song.title}</div>
            `;
            
            songElement.addEventListener('click', () => {
                // 找到歌曲在原始列表中的索引并播放
                const songIndex = this.songs.findIndex(s => s.id === song.id);
                this.playSong(songIndex);
            });
            
            this.playlistContainer.appendChild(songElement);
        });
    }
    
    // 设置事件监听器
    setupEventListeners() {
        // 播放/暂停按钮
        this.playBtn.addEventListener('click', () => {
            this.togglePlay();
        });
        
        // 上一首按钮
        this.prevBtn.addEventListener('click', () => {
            this.playPrev();
        });
        
        // 下一首按钮
        this.nextBtn.addEventListener('click', () => {
            this.playNext();
        });
        
        // 音频时间更新事件
        this.audioPlayer.addEventListener('timeupdate', () => {
            this.updateProgress();
        });
        
        // 音频加载完毕事件
        this.audioPlayer.addEventListener('loadedmetadata', () => {
            this.updateTotalTime();
        });
        
        // 音频结束事件
        this.audioPlayer.addEventListener('ended', () => {
            this.playNext();
        });
        
        // 进度条点击事件
        this.progressBar.parentElement.addEventListener('click', (e) => {
            const rect = this.progressBar.parentElement.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            this.seekTo(pos);
        });
        
        // 搜索框输入事件
        if (this.searchInput) {
            this.searchInput.addEventListener('input', (e) => {
                this.filterSongs(e.target.value);
            });
        }
    }
    
    // 过滤歌曲
    filterSongs(searchTerm) {
        if (!searchTerm) {
            this.filteredSongs = [...this.songs];
        } else {
            const term = searchTerm.toLowerCase();
            this.filteredSongs = this.songs.filter(song => 
                song.title.toLowerCase().includes(term)
            );
        }
        this.renderPlaylist();
    }
    
    // 播放指定索引的歌曲
    playSong(index) {
        if (index < 0 || index >= this.songs.length) return;
        
        this.currentSongIndex = index;
        const song = this.songs[index];
        
        // 更新音频源
        this.audioPlayer.src = song.file;
        this.currentSongDisplay.textContent = `${index + 1}. ${song.title}`;
        
        // 更新播放列表中的激活状态
        this.updateActiveSong();
        
        // 播放
        this.audioPlayer.play();
        this.isPlaying = true;
        this.playBtn.innerHTML = '⏸';
        
        // 开始更新进度
        this.startProgressTimer();
    }
    
    // 切换播放/暂停状态
    togglePlay() {
        if (this.audioPlayer.src) {
            if (this.isPlaying) {
                this.audioPlayer.pause();
                this.playBtn.innerHTML = '▶';
                this.isPlaying = false;
                this.stopProgressTimer();
            } else {
                this.audioPlayer.play();
                this.playBtn.innerHTML = '⏸';
                this.isPlaying = true;
                this.startProgressTimer();
            }
        } else {
            // 如果没有歌曲在播放，播放第一首
            this.playSong(0);
        }
    }
    
    // 播放上一首
    playPrev() {
        let newIndex = this.currentSongIndex - 1;
        if (newIndex < 0) newIndex = this.songs.length - 1;
        this.playSong(newIndex);
    }
    
    // 播放下一首
    playNext() {
        let newIndex = this.currentSongIndex + 1;
        if (newIndex >= this.songs.length) newIndex = 0;
        this.playSong(newIndex);
    }
    
    // 更新进度条
    updateProgress() {
        if (this.audioPlayer.duration) {
            const progress = (this.audioPlayer.currentTime / this.audioPlayer.duration) * 100;
            this.progressBar.style.width = `${progress}%`;
            
            // 更新时间显示
            this.currentTimeDisplay.textContent = this.formatTime(this.audioPlayer.currentTime);
        }
    }
    
    // 更新总时间
    updateTotalTime() {
        if (this.audioPlayer.duration) {
            this.totalTimeDisplay.textContent = this.formatTime(this.audioPlayer.duration);
        }
    }
    
    // 跳转到指定位置
    seekTo(position) {
        if (this.audioPlayer.duration) {
            this.audioPlayer.currentTime = position * this.audioPlayer.duration;
        }
    }
    
    // 开始进度计时器
    startProgressTimer() {
        if (this.timerInterval) {
            clearInterval(this.timerInterval);
        }
        
        this.timerInterval = setInterval(() => {
            this.updateProgress();
        }, 1000);
    }
    
    // 停止进度计时器
    stopProgressTimer() {
        if (this.timerInterval) {
            clearInterval(this.timerInterval);
            this.timerInterval = null;
        }
    }
    
    // 更新播放列表中的激活歌曲
    updateActiveSong() {
        const songItems = document.querySelectorAll('.song-item');
        songItems.forEach((item, index) => {
            // 找到当前歌曲在过滤后列表中的索引
            const songId = this.filteredSongs[index]?.id;
            if (songId && this.songs[this.currentSongIndex]?.id === songId) {
                item.classList.add('active');
                // 滚动到可见区域
                item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                item.classList.remove('active');
            }
        });
    }
    
    // 更新歌曲计数
    updateSongCount() {
        this.songCountDisplay.textContent = this.songs.length;
    }
    
    // 格式化时间显示 (秒 -> 分:秒)
    formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
}

// 页面加载完成后初始化播放器
document.addEventListener('DOMContentLoaded', () => {
    const player = new MusicPlayer();
    
    // 将播放器实例暴露给全局，方便调试
    window.musicPlayer = player;
    
    // 播放第一首歌曲
    setTimeout(() => {
        if (player.songs.length > 0) {
            player.playSong(0);
        }
    }, 500);
});
